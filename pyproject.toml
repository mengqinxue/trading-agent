[project]
name = "trading-agent"
version = "0.1.0"
description = "A股交易辅助系统 - LangGraph 多 agent 分析"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "akshare>=1.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "tushare>=1.4.29",
    "pytest>=9.0.3",
    "httpx>=0.25.0,<0.26.0",
    "pytest-cov>=7.1.0",
    "mootdx>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
trading-agent = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
