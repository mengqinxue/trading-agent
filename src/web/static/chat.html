<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能查询 - Trading Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        header h1 {
            margin-bottom: 5px;
        }
        header p {
            margin-bottom: 0;
        }
        .back-link {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .chat-input-area {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chat-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chat-input button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .chat-input button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .example-queries {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .example-query {
            padding: 6px 12px;
            background: #f0f5ff;
            border: 1px solid #d6e4ff;
            border-radius: 4px;
            font-size: 13px;
            color: #2f54eb;
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-query:hover {
            background: #d6e4ff;
        }
        .result-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-title {
            font-size: 18px;
            font-weight: 600;
        }
        .result-count {
            color: #667eea;
            font-weight: 500;
        }
        .result-date {
            color: #999;
            font-size: 14px;
        }
        .stock-table {
            width: 100%;
            border-collapse: collapse;
        }
        .stock-table th, .stock-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .stock-table th {
            background: #fafafa;
            font-weight: 500;
        }
        .stock-table tr:hover {
            background: #f5f5f5;
        }
        .change-positive {
            color: #f5222d;
        }
        .change-negative {
            color: #52c41a;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .ai-thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f0f5ff;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .ai-thinking-icon {
            width: 20px;
            height: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .ai-explanation {
            background: #f6f8fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }
        .error-msg {
            color: #f5222d;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>智能查询</h1>
                <p>自然语言查询本地股票数据，AI 理解语义并返回结果</p>
            </div>
            <a href="/" class="back-link">← 返回主页</a>
        </header>

        <main class="chat-container">
            <!-- 输入区 -->
            <div class="chat-input-area">
                <div class="chat-input">
                    <input type="text" id="query-input" placeholder="输入问题，如：最近涨幅超过10%的银行股有哪些？" autofocus>
                    <button id="submit-btn">查询</button>
                </div>
                <div class="example-queries">
                    <span style="color: #999; font-size: 13px;">示例：</span>
                    <span class="example-query">涨幅超过5%的科技股</span>
                    <span class="example-query">最近涨停的股票</span>
                    <span class="example-query">换手率超过20%的小盘股</span>
                    <span class="example-query">银行板块龙头股</span>
                    <span class="example-query">PE低于15的价值股</span>
                    <span class="example-query">最近一周上涨的医药股</span>
                </div>
            </div>

            <!-- 结果展示区 -->
            <div id="result-area">
                <div class="loading">输入自然语言问题，AI 将理解语义并查询本地数据库</div>
            </div>
        </main>

        <footer>
            <p>Trading Agent v0.1.0 | AI + 本地数据查询</p>
        </footer>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
